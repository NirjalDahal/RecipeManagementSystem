<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Form</title>
    <link rel="stylesheet" href="css/recipe.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="recipe.html" class="logo">🍳 Recipe Manager</a>

      <nav>
        <a href="recipe.html">Recipes</a>
        <a href="ingredients.html">Ingredients</a>
        <a href="login.html" class="logout-btn">Logout</a>
      </nav>
    </header>

    <main class="add-recipe-container">
      <h1>Add New Recipe</h1>

      <form class="recipeForm">
        <div class="form-group">
          <label for="recipeName">Recipe Name:</label>
          <input type="text" id="recipeName" />
          <span class="error" id="recipeNameError"></span>
        </div>

        <div class="form-group">
          <label for="recipeDescription">Recipe Description:</label>
          <textarea id="recipeDescription"></textarea>
          <span class="error" id="recipeDescriptionError"></span>
        </div>

        <div class="form-group" id="flex-group">
          <div class="category">
            <label for="category">Category:</label>
            <input type="text" id="category" />
            <span class="error" id="categoryError"></span>
          </div>

          <div class="cuisine">
            <label for="cuisine">Cuisine:</label>
            <input type="text" id="cuisine" />
            <span class="error" id="cuisineError"></span>
          </div>

          <div class="difficulty">
            <label for="difficulty">Difficulty:</label>

            <select id="difficulty">
              <option value="">Select Difficulty</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>

          <div class="time">
            <label for="time">Prep Time:</label>
            <input type="number" id="prep-time" />
            <span class="error" id="prep-timeError"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="instruction">Instructions:</label>
          <textarea
            id="instruction"
            placeholder="Enter each instruction on a new line"
          ></textarea>
          <span class="error" id="instructionError"></span>
        </div>

        <div class="ingredients-section">
          <h2>Ingredients</h2>

          <div class="ingredient-row">
            <select>
              <option value="">Select Ingredient</option>
            </select>

            <input type="number" placeholder="Quantity" min="0" />

            <span class="unit">Grams</span>

            <button type="button" class="remove-btn">Remove</button>
          </div>

          <button type="button" id="add-btn">+ Add Ingredient</button>
        </div>

        <div class="image-section">
          <h2>Upload Image</h2>
          <input type="file" id="recipeImage" accept="image/*" />
        </div>

        <button type="submit" id="save-btn">Save Recipe</button>
      </form>
    </main>
    <footer class="footer">
      <p>&copy; 2026 Recipe Manager. All rights reserved.</p>
    </footer>

    <script src="js/recipe-form.js"></script>
  </body>
</html>
