<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/recipe.css" />

    <title>Recipes</title>
  </head>

  <body>
    <header class="navbar">
      <a href="recipe.html" class="logo">🍳 Recipe Manager</a>

      <nav>
        <a href="recipe.html">Recipes</a>
        <a href="ingredients.html">Ingredients</a>
        <a href="index.html" class="logout-btn">Logout</a>
      </nav>
    </header>

    <main class="recipe-page">
      <div class="recipe-header">
        <h1>All Recipes</h1>

        <a href="recipe-form.html" class="add-recipe-btn">+ Add Recipe</a>
      </div>

      <div class="search-section">
        <input type="text" placeholder="Search recipe..." id="search-recipe" />

        <button class="search">Search</button>
      </div>

      <div class="filter-section">
        <div class="filter-group">
          <label for="category-filter">Category</label>
          <select id="category-filter">
            <option value="">All Categories</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snack">Snack</option>
            <option value="Dessert">Dessert</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="cuisine-filter">Cuisine</label>
          <select id="cuisine-filter">
            <option value="">All Cuisines</option>
            <option value="Asian">Asian</option>
            <option value="Indian">Indian</option>
            <option value="Italian">Italian</option>
            <option value="Chinese">Chinese</option>
            <option value="Mexican">Mexican</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="difficulty-filter">Difficulty</label>
          <select id="difficulty-filter">
            <option value="">All Difficulty Levels</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
      </div>

      <section class="recipe-grid">
        <div class="recipe-card">
          <img src="images/chickenCurry.jpg" alt="chicken-curry" />

          <div class="recipe-card-content">
            <h2>Chicken Curry</h2>

            <p>Asian</p>
            <p><span>Medium</span></p>

            <a href="recipe-details.html">View Recipe</a>
            <button class="favorite-btn">♡</button>
          </div>
        </div>

        <div class="recipe-card">
          <img src="images/spaghetti-pasta.jpg" alt="pasta" />

          <div class="recipe-card-content">
            <h2>Spaghetti Pasta</h2>

            <p>Italian</p>
            <p><span>Easy</span></p>

            <a href="recipe-details.html">View Recipe</a>
            <button class="favorite-btn">♡</button>
          </div>
        </div>

        <div class="recipe-card">
          <img src="images/chocolate-brownies.avif" alt="pasta" />

          <div class="recipe-card-content">
            <h2>Chocolate Brownies</h2>

            <p>Dessert</p>
            <p><span>Medium</span></p>

            <a href="recipe-details.html">View Recipe</a>
            <button class="favorite-btn">♡</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Recipe Manager. All rights reserved.</p>
    </footer>

    <script src="js/recipe.js"></script>
  </body>
</html>
