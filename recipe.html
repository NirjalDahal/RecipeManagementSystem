<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/recipe.css" />

    <title>Recipes</title>
  </head>

  <body>
    <header class="navbar">
      <a href="recipe.html" class="logo">🍳 Recipe Manager</a>

      <nav>
        <a href="recipe.html">Recipes</a>
        <a href="ingredients.html">Ingredients</a>
        <a href="index.html" class="logout-btn">Logout</a>
      </nav>
    </header>

    <main class="recipe-page">
      <div class="recipe-header">
        <h1>All Recipes</h1>

        <a href="recipe-form.html" class="add-recipe-btn">+ Add Recipe</a>
      </div>

      <div class="search-section">
        <input type="text" placeholder="Search recipe..." id="search-recipe" />

        <select id="difficulty-filter">
          <option value="">All Difficulty Levels</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>

        <button class="search">Search</button>
      </div>

      <section class="recipe-grid">
        <div class="recipe-card">
          <img src="" alt="chicken-curry" />

          <div class="recipe-card-content">
            <h2>Chicken Curry</h2>

            <p>Asian</p>
            <p><span>Medium</span></p>

            <a href="recipe-details.html">View Recipe</a>
          </div>
        </div>

        <div class="recipe-card">
          <img src="" alt="pasta" />

          <div class="recipe-card-content">
            <h2>Spaghetti Pasta</h2>

            <p>Italian</p>
            <p><span>Easy</span></p>

            <a href="recipe-details.html">View Recipe</a>
          </div>
        </div>

        <div class="recipe-card">
          <img src="" alt="pasta" />

          <div class="recipe-card-content">
            <h2>Spaghetti Pasta</h2>

            <p>Italian</p>
            <p><span>Easy</span></p>

            <a href="recipe-details.html">View Recipe</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Recipe Manager. All rights reserved.</p>
    </footer>
  </body>
</html>
